services:
  backend:
    build:
      context: ./server
    image: pvms-backend:latest
    restart: unless-stopped
    # Measured idle: ~0% CPU, ~50 MB RAM. Limits are guard rails against a
    # leak or runaway loop starving the other apps on this 2-core VPS (not a
    # squeeze): 20x the working set (ExcelJS parses a whole 20k-row Order
    # Imports workbook in memory), 1.5 of 2 cores. The service stays always
    # on — in-process schedules (Forward Scan copy, nightly SKU photos, Ajio
    # safety net, retention) and packers' first scans need it awake; idle
    # costs nothing because Node only wakes for timers and requests.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.5
    # tini as PID 1: signals reach Node (graceful shutdown lets a running
    # job / request finish) and zombies are reaped.
    init: true
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 8080
      # Heap cap well under mem_limit: V8 collects earlier instead of
      # growing to the container limit.
      NODE_OPTIONS: "--max-old-space-size=640"
      DATABASE_URL: ${DATABASE_URL}
      PGSSL_MODE: ${PGSSL_MODE:-require}
      PGSSL_CA_CERT: ${PGSSL_CA_CERT:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${APP_DOMAIN:-vms.youthnic.shop}}
      AUTO_PROVISION_USERS: "false"
      ORDER_RECONCILE_SECRET: ${ORDER_RECONCILE_SECRET}
      REPORT_JOB_SECRET: ${REPORT_JOB_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REPORT_FROM_EMAIL: ${REPORT_FROM_EMAIL:-}
      REPORT_TO_EMAILS: ${REPORT_TO_EMAILS:-}
      OMSGURU_TOKEN: ${OMSGURU_TOKEN:-}
      OMSGURU_CID: ${OMSGURU_CID:-}
      OMSGURU_WAREHOUSE_ID: ${OMSGURU_WAREHOUSE_ID:-}
      AJIO_WFR_SECRET: ${AJIO_WFR_SECRET:-}
      AJIO_GMAIL_ADDRESS: ${AJIO_GMAIL_ADDRESS:-}
      AJIO_GMAIL_APP_PASSWORD: ${AJIO_GMAIL_APP_PASSWORD:-}
      AJIO_GMAIL_OAUTH_CLIENT_ID: ${AJIO_GMAIL_OAUTH_CLIENT_ID:-}
      AJIO_GMAIL_OAUTH_CLIENT_SECRET: ${AJIO_GMAIL_OAUTH_CLIENT_SECRET:-}
      AJIO_TEST_SENDERS: ${AJIO_TEST_SENDERS:-}
      AJIO_GDRIVE_SA_JSON: ${AJIO_GDRIVE_SA_JSON:-}
      AJIO_GDRIVE_FOLDER_ID: ${AJIO_GDRIVE_FOLDER_ID:-}
      AJIO_WFR_INTERVAL_HOURS: ${AJIO_WFR_INTERVAL_HOURS:-6}
      AJIO_WFR_SLA_HOURS: ${AJIO_WFR_SLA_HOURS:-12}
      AJIO_ALERT_EMAILS: ${AJIO_ALERT_EMAILS:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      DESKTOP_DOWNLOAD_DIR: /app/downloads
      # Orders come from Forward Scan's PostgreSQL on this VPS (no OMSGuru
      # API calls from VMS), read-only. Set by the DATA_SYNC_DATABASE_URL
      # GitHub secret, else the deploy copies Forward Scan's own
      # DATABASE_URL from /opt/forward-scan/Forward-Scan/.env.
      DATA_SYNC_DATABASE_URL: ${DATA_SYNC_DATABASE_URL:-}
      # A localhost / 127.0.0.1 host in that URL means the VPS, not this
      # container: the backend connects to this alias instead.
      DATA_SYNC_LOCALHOST_ALIAS: ${DATA_SYNC_LOCALHOST_ALIAS:-host.docker.internal}
      # Legacy SQLite source, rollback only. No default: Forward Scan's
      # SQLite file stopped updating when it moved to PostgreSQL (7 Oct
      # 2026), so defaulting to it showed stale orders as a healthy copy.
      FORWARD_SCAN_DATABASE_URL: ${FORWARD_SCAN_DATABASE_URL:-}
      FORWARD_SCAN_RETENTION_DAYS: ${FORWARD_SCAN_RETENTION_DAYS:-3}
      FORWARD_SCAN_SYNC_INTERVAL_SECONDS: ${FORWARD_SCAN_SYNC_INTERVAL_SECONDS:-300}
      FORWARD_SCAN_ORG_IDS: ${FORWARD_SCAN_ORG_IDS:-}
      # Marketplaces VMS does not copy ("none" = copy all).
      FORWARD_SCAN_EXCLUDE_MARKETPLACES: "${FORWARD_SCAN_EXCLUDE_MARKETPLACES:-Flipkart,Myntra Youthnic,Myntra PPMP}"
      # Nightly SKU photo sync from OMSGuru listings (no order calls); keeps
      # RESERVE of every 60 calls / 5 min for Forward Scan.
      SKU_IMAGE_SYNC_ENABLED: ${SKU_IMAGE_SYNC_ENABLED:-true}
      SKU_IMAGE_SYNC_HOUR_IST: ${SKU_IMAGE_SYNC_HOUR_IST:-2}
      SKU_IMAGE_SYNC_MAX_MINUTES: ${SKU_IMAGE_SYNC_MAX_MINUTES:-60}
      SKU_IMAGE_SYNC_RESERVE: ${SKU_IMAGE_SYNC_RESERVE:-25}
      SKU_IMAGE_SYNC_FULL_REFRESH_DAYS: ${SKU_IMAGE_SYNC_FULL_REFRESH_DAYS:-30}
      # Nightly re-packed AWB clean-up: newest video per AWB stays, older
      # ones go (see AGENTS.md "Re-packed AWBs").
      DUPLICATE_RECORDING_CLEANUP_ENABLED: ${DUPLICATE_RECORDING_CLEANUP_ENABLED:-true}
      DUPLICATE_RECORDING_CLEANUP_HOUR_IST: ${DUPLICATE_RECORDING_CLEANUP_HOUR_IST:-2}
      DUPLICATE_RECORDING_MIN_SECONDS: ${DUPLICATE_RECORDING_MIN_SECONDS:-5}
      DUPLICATE_RECORDING_MAX_GAP_DAYS: ${DUPLICATE_RECORDING_MAX_GAP_DAYS:-30}
      DUPLICATE_RECORDING_CLEANUP_LIMIT: ${DUPLICATE_RECORDING_CLEANUP_LIMIT:-500}
    volumes:
      # Published desktop installers survive redeploys: the host dir sits
      # OUTSIDE /opt/pvms/app (the deploy wipes that tree on every release).
      # The release workflow copies files here.
      - /opt/pvms/downloads:/app/downloads
      # Forward Scan's data dir (its deploy keeps it across releases), only
      # used when FORWARD_SCAN_DATABASE_URL points at the legacy SQLite file.
      # Writable only because SQLite WAL readers need the -shm lock file.
      - /opt/forward-scan/Forward-Scan/data:/forward-scan-data
    extra_hosts:
      # Forward Scan's PostgreSQL is published on the host
      # (host.docker.internal:5433), same as Forward Scan's own container.
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    networks:
      # default (app_default) plus the shared VPS network so the backend
      # reaches Postgres by container name (postgres:5432) instead of a
      # published host port that can vanish on container recreate.
      - default
      - shared_infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvms-api.rule=Host(`vms.youthnic.shop`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.pvms-api.entrypoints=websecure"
      - "traefik.http.routers.pvms-api.tls=true"
      - "traefik.http.routers.pvms-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvms-api.priority=100"
      - "traefik.http.services.pvms-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      # First start runs ensureRuntimeTables (schema + one-time backfills).
      start_period: 60s

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${APP_DOMAIN:-vms.youthnic.shop}}
        VITE_ORG_ID: ${VITE_ORG_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_RECAPTCHA_KEY: ${VITE_RECAPTCHA_KEY:-}
    image: pvms-frontend:latest
    restart: unless-stopped
    # Static nginx (~3 MB measured).
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.5
    init: true
    stop_grace_period: 10s
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvms-frontend.rule=Host(`vms.youthnic.shop`)"
      - "traefik.http.routers.pvms-frontend.entrypoints=websecure"
      - "traefik.http.routers.pvms-frontend.tls=true"
      - "traefik.http.routers.pvms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvms-frontend.priority=10"
      - "traefik.http.services.pvms-frontend.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  shared_infra:
    external: true
