services:
  backend:
    build:
      context: ./server
    image: pvms-backend:latest
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL}
      PGSSL_MODE: ${PGSSL_MODE:-require}
      PGSSL_CA_CERT: ${PGSSL_CA_CERT:-}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${FIREBASE_SERVICE_ACCOUNT_JSON}
      FIREBASE_STORAGE_BUCKET: ${FIREBASE_STORAGE_BUCKET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${APP_DOMAIN:-vms.youthnic.shop}}
      AUTO_PROVISION_USERS: "false"
      ORDER_RECONCILE_SECRET: ${ORDER_RECONCILE_SECRET}
      REPORT_JOB_SECRET: ${REPORT_JOB_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      REPORT_FROM_EMAIL: ${REPORT_FROM_EMAIL:-}
      REPORT_TO_EMAILS: ${REPORT_TO_EMAILS:-}
      OMSGURU_TOKEN: ${OMSGURU_TOKEN:-}
      OMSGURU_CID: ${OMSGURU_CID:-}
      OMSGURU_WAREHOUSE_ID: ${OMSGURU_WAREHOUSE_ID:-}
      AJIO_WFR_SECRET: ${AJIO_WFR_SECRET:-}
      AJIO_GMAIL_ADDRESS: ${AJIO_GMAIL_ADDRESS:-}
      AJIO_GMAIL_APP_PASSWORD: ${AJIO_GMAIL_APP_PASSWORD:-}
      AJIO_GMAIL_OAUTH_CLIENT_ID: ${AJIO_GMAIL_OAUTH_CLIENT_ID:-}
      AJIO_GMAIL_OAUTH_CLIENT_SECRET: ${AJIO_GMAIL_OAUTH_CLIENT_SECRET:-}
      AJIO_TEST_SENDERS: ${AJIO_TEST_SENDERS:-}
      AJIO_GDRIVE_SA_JSON: ${AJIO_GDRIVE_SA_JSON:-}
      AJIO_GDRIVE_FOLDER_ID: ${AJIO_GDRIVE_FOLDER_ID:-}
      AJIO_WFR_INTERVAL_HOURS: ${AJIO_WFR_INTERVAL_HOURS:-6}
      AJIO_WFR_SLA_HOURS: ${AJIO_WFR_SLA_HOURS:-12}
      AJIO_ALERT_EMAILS: ${AJIO_ALERT_EMAILS:-}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      DESKTOP_DOWNLOAD_DIR: /app/downloads
      # Orders come from the Forward Scan database on this VPS (no OMSGuru
      # API calls from VMS). Absolute sqlite path = four slashes.
      FORWARD_SCAN_DATABASE_URL: ${FORWARD_SCAN_DATABASE_URL:-sqlite:////forward-scan-data/omsguru_forward_scan.db}
      FORWARD_SCAN_RETENTION_DAYS: ${FORWARD_SCAN_RETENTION_DAYS:-3}
      FORWARD_SCAN_SYNC_INTERVAL_SECONDS: ${FORWARD_SCAN_SYNC_INTERVAL_SECONDS:-120}
      FORWARD_SCAN_ORG_IDS: ${FORWARD_SCAN_ORG_IDS:-}
      # Marketplaces VMS does not copy ("none" = copy all).
      FORWARD_SCAN_EXCLUDE_MARKETPLACES: "${FORWARD_SCAN_EXCLUDE_MARKETPLACES:-Flipkart,Myntra Youthnic,Myntra PPMP}"
    volumes:
      # Published desktop installers survive redeploys: the host dir sits
      # OUTSIDE /opt/pvms/app (the deploy wipes that tree on every release).
      # The release workflow copies files here.
      - /opt/pvms/downloads:/app/downloads
      # Forward Scan's data dir (its deploy keeps it across releases). VMS
      # opens the SQLite file read-only; the mount stays writable only
      # because SQLite WAL readers need the -shm lock file.
      - /opt/forward-scan/Forward-Scan/data:/forward-scan-data
    expose:
      - "8080"
    networks:
      # default (app_default) plus the shared VPS network so the backend
      # reaches Postgres by container name (postgres:5432) instead of a
      # published host port that can vanish on container recreate.
      - default
      - shared_infra
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvms-api.rule=Host(`vms.youthnic.shop`) && (PathPrefix(`/api`) || PathPrefix(`/health`))"
      - "traefik.http.routers.pvms-api.entrypoints=websecure"
      - "traefik.http.routers.pvms-api.tls=true"
      - "traefik.http.routers.pvms-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvms-api.priority=100"
      - "traefik.http.services.pvms-api.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: ${VITE_API_URL:-https://${APP_DOMAIN:-vms.youthnic.shop}}
        VITE_ORG_ID: ${VITE_ORG_ID}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID}
        VITE_RECAPTCHA_KEY: ${VITE_RECAPTCHA_KEY:-}
    image: pvms-frontend:latest
    restart: unless-stopped
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pvms-frontend.rule=Host(`vms.youthnic.shop`)"
      - "traefik.http.routers.pvms-frontend.entrypoints=websecure"
      - "traefik.http.routers.pvms-frontend.tls=true"
      - "traefik.http.routers.pvms-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pvms-frontend.priority=10"
      - "traefik.http.services.pvms-frontend.loadbalancer.server.port=80"
    depends_on:
      backend:
        condition: service_healthy

networks:
  shared_infra:
    external: true
