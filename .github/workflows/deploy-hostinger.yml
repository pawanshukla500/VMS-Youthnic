name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install and validate server
        working-directory: server
        run: |
          npm ci
          npm run build
          npx vitest run
          # Advisory only: the npm audit endpoint is flaky/being retired and
          # must never block a release. Builds + tests are the real gates.
          npm audit --audit-level=high || echo "WARNING: npm audit unavailable, skipping"

      - name: Install and validate client
        working-directory: client
        run: |
          npm ci
          npm run build
          npx vitest run
          # Advisory only: see server step above.
          npm audit --audit-level=high || echo "WARNING: npm audit unavailable, skipping"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ORDER_RECONCILE_SECRET: ${{ secrets.ORDER_RECONCILE_SECRET }}
        run: |
          missing=()
          for name in HOSTINGER_HOST HOSTINGER_USER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ -z "$HOSTINGER_SSH_KEY" ] && [ -z "$HOSTINGER_PASSWORD" ]; then
            missing+=("HOSTINGER_SSH_KEY or HOSTINGER_PASSWORD")
          fi
          if [ -z "$HOSTINGER_ENV_FILE" ]; then
            for name in APP_DOMAIN ALLOWED_ORIGINS DATABASE_URL FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_STORAGE_BUCKET ORDER_RECONCILE_SECRET; do
              if [ -z "${!name}" ]; then missing+=("$name"); fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare remote access
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          for i in {1..5}; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts && break || sleep 5
          done

      - name: Package source
        run: |
          git archive --format=tar.gz --output=pvms-source.tar.gz HEAD

      - name: Upload source
        env:
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL_MODE: ${{ secrets.PGSSL_MODE }}
          PGSSL_CA_CERT: ${{ secrets.PGSSL_CA_CERT }}
          PG_POOL_MAX: ${{ secrets.PG_POOL_MAX }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ORDER_RECONCILE_SECRET: ${{ secrets.ORDER_RECONCILE_SECRET }}
          REPORT_JOB_SECRET: ${{ secrets.REPORT_JOB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_TO_EMAILS: ${{ secrets.REPORT_TO_EMAILS }}
          STORAGE_DIR: ${{ secrets.STORAGE_DIR }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ORG_ID: ${{ secrets.VITE_ORG_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_KEY: ${{ secrets.VITE_RECAPTCHA_KEY }}
          OMSGURU_TOKEN: ${{ secrets.OMSGURU_TOKEN }}
          OMSGURU_CID: ${{ secrets.OMSGURU_CID }}
          OMSGURU_WAREHOUSE_ID: ${{ secrets.OMSGURU_WAREHOUSE_ID }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          ssh_cmd=(ssh -p "$HOSTINGER_PORT")
          scp_cmd=(scp -P "$HOSTINGER_PORT")
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            ssh_cmd+=(-i ~/.ssh/hostinger_key)
            scp_cmd+=(-i ~/.ssh/hostinger_key)
          else
            export SSHPASS="$HOSTINGER_PASSWORD"
            ssh_cmd=(sshpass -e "${ssh_cmd[@]}")
            scp_cmd=(sshpass -e "${scp_cmd[@]}")
          fi

          if [ -n "$HOSTINGER_ENV_FILE" ]; then
            printf '%s\n' "$HOSTINGER_ENV_FILE" > hostinger.env
          else
            cat > hostinger.env <<EOF
          APP_DOMAIN=$APP_DOMAIN
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://$APP_DOMAIN}
          DATABASE_URL=$DATABASE_URL
          PGSSL_MODE=${PGSSL_MODE:-require}
          PGSSL_CA_CERT=$PGSSL_CA_CERT
          PG_POOL_MAX=${PG_POOL_MAX:-10}
          FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT_JSON
          FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          ORDER_RECONCILE_SECRET=$ORDER_RECONCILE_SECRET
          REPORT_JOB_SECRET=$REPORT_JOB_SECRET
          RESEND_API_KEY=$RESEND_API_KEY
          REPORT_FROM_EMAIL=$REPORT_FROM_EMAIL
          REPORT_TO_EMAILS=$REPORT_TO_EMAILS
          STORAGE_DIR=${STORAGE_DIR:-uploads}
          VITE_API_URL=${VITE_API_URL:-https://$APP_DOMAIN}
          VITE_ORG_ID=${VITE_ORG_ID:-default}
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          VITE_RECAPTCHA_KEY=$VITE_RECAPTCHA_KEY
          AUTO_PROVISION_USERS=false
          EOF
          fi
          # HOSTINGER_ENV_FILE is normally a complete custom env file. Keep
          # separately managed OMSGuru secrets authoritative in both modes;
          # otherwise they silently disappear from the VPS in custom-file mode.
          if [ -n "$OMSGURU_TOKEN" ]; then printf '\nOMSGURU_TOKEN=%s\n' "$OMSGURU_TOKEN" >> hostinger.env; fi
          if [ -n "$OMSGURU_CID" ]; then printf 'OMSGURU_CID=%s\n' "$OMSGURU_CID" >> hostinger.env; fi
          if [ -n "$OMSGURU_WAREHOUSE_ID" ]; then printf 'OMSGURU_WAREHOUSE_ID=%s\n' "$OMSGURU_WAREHOUSE_ID" >> hostinger.env; fi
          # Self-heal a stale DB host pointer: ephemeral published ports
          # (e.g. :32774) vanish when the Postgres container is recreated,
          # while the secret keeps pointing at them — then the backend
          # crash-loops at boot (old pooled connections mask it until the
          # next restart). Rewrite to the stable Docker-network address;
          # user/password/dbname pass through byte-identical. Anything else
          # (including an already-correct postgres:5432) is left untouched.
          python3 - <<'PYEOF'
          import re
          with open('hostinger.env') as f:
              lines = f.read().split('\n')
          out = []
          migrated = False
          for line in lines:
              if line.startswith('DATABASE_URL='):
                  value = line[len('DATABASE_URL='):]
                  m = re.search(r'@srv1845788\.hstgr\.cloud:(\d+)(?=/|\?|$)', value, re.IGNORECASE)
                  if m and 32768 <= int(m.group(1)) <= 60999:
                      value = value[:m.start()] + '@postgres:5432' + value[m.end():]
                      line = 'DATABASE_URL=' + value
                      migrated = True
              out.append(line)
          with open('hostinger.env', 'w') as f:
              f.write('\n'.join(out))
          print('DATABASE_URL host migrated to postgres:5432' if migrated else 'DATABASE_URL host left untouched')
          PYEOF
          "${ssh_cmd[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" "mkdir -p /opt/pvms"
          "${scp_cmd[@]}" pvms-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/pvms/pvms-source.tar.gz"
          "${scp_cmd[@]}" hostinger.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/pvms/hostinger.env"

      - name: Deploy containers
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          ssh_cmd=(ssh -p "$HOSTINGER_PORT")
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            ssh_cmd+=(-i ~/.ssh/hostinger_key)
          else
            export SSHPASS="$HOSTINGER_PASSWORD"
            ssh_cmd=(sshpass -e "${ssh_cmd[@]}")
          fi

          "${ssh_cmd[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          
          # Create 2GB swapfile if it doesn't exist to prevent OOM during build
          if [ ! -f /swapfile ]; then
            echo "Creating 2GB swapfile to prevent OOM..."
            fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile || true
            echo '/swapfile none swap sw 0 0' | tee -a /etc/fstab || true
          fi

          cd /opt/pvms
          rm -rf app
          mkdir app
          tar -xzf pvms-source.tar.gz -C app
          cd app
          mv /opt/pvms/hostinger.env .env
          chmod 600 .env
          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.hostinger.yml --env-file .env up -d --build --remove-orphans
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose -f docker-compose.hostinger.yml --env-file .env up -d --build --remove-orphans
          else
            echo "Docker Compose is not installed on the VPS"
            exit 1
          fi
          docker image prune -f
          EOF
