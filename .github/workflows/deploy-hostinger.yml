name: Deploy to Hostinger VPS

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install and validate server
        working-directory: server
        run: |
          npm ci
          npm run build
          npx vitest run
          # Advisory only: the npm audit endpoint is flaky/being retired and
          # must never block a release. Builds + tests are the real gates.
          npm audit --audit-level=high || echo "WARNING: npm audit unavailable, skipping"

      - name: Install and validate client
        working-directory: client
        run: |
          npm ci
          npm run build
          npx vitest run
          # Advisory only: see server step above.
          npm audit --audit-level=high || echo "WARNING: npm audit unavailable, skipping"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ORDER_RECONCILE_SECRET: ${{ secrets.ORDER_RECONCILE_SECRET }}
        run: |
          missing=()
          for name in HOSTINGER_HOST HOSTINGER_USER; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ -z "$HOSTINGER_SSH_KEY" ] && [ -z "$HOSTINGER_PASSWORD" ]; then
            missing+=("HOSTINGER_SSH_KEY or HOSTINGER_PASSWORD")
          fi
          if [ -z "$HOSTINGER_ENV_FILE" ]; then
            for name in APP_DOMAIN ALLOWED_ORIGINS DATABASE_URL FIREBASE_SERVICE_ACCOUNT_JSON FIREBASE_STORAGE_BUCKET ORDER_RECONCILE_SECRET; do
              if [ -z "${!name}" ]; then missing+=("$name"); fi
            done
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            printf 'Missing required deploy secrets: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Prepare remote access
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          for i in {1..5}; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts && break || sleep 5
          done

      - name: Package source
        run: |
          git archive --format=tar.gz --output=pvms-source.tar.gz HEAD

      - name: Upload source
        env:
          HOSTINGER_ENV_FILE: ${{ secrets.HOSTINGER_ENV_FILE }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSL_MODE: ${{ secrets.PGSSL_MODE }}
          PGSSL_CA_CERT: ${{ secrets.PGSSL_CA_CERT }}
          PG_POOL_MAX: ${{ secrets.PG_POOL_MAX }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          ORDER_RECONCILE_SECRET: ${{ secrets.ORDER_RECONCILE_SECRET }}
          REPORT_JOB_SECRET: ${{ secrets.REPORT_JOB_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_FROM_EMAIL: ${{ secrets.REPORT_FROM_EMAIL }}
          REPORT_TO_EMAILS: ${{ secrets.REPORT_TO_EMAILS }}
          STORAGE_DIR: ${{ secrets.STORAGE_DIR }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ORG_ID: ${{ secrets.VITE_ORG_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_KEY: ${{ secrets.VITE_RECAPTCHA_KEY }}
          OMSGURU_TOKEN: ${{ secrets.OMSGURU_TOKEN }}
          OMSGURU_CID: ${{ secrets.OMSGURU_CID }}
          OMSGURU_WAREHOUSE_ID: ${{ secrets.OMSGURU_WAREHOUSE_ID }}
          AJIO_WFR_SECRET: ${{ secrets.AJIO_WFR_SECRET }}
          AJIO_GMAIL_ADDRESS: ${{ secrets.AJIO_GMAIL_ADDRESS }}
          AJIO_GMAIL_APP_PASSWORD: ${{ secrets.AJIO_GMAIL_APP_PASSWORD }}
          AJIO_GMAIL_OAUTH_CLIENT_ID: ${{ secrets.AJIO_GMAIL_OAUTH_CLIENT_ID }}
          AJIO_GMAIL_OAUTH_CLIENT_SECRET: ${{ secrets.AJIO_GMAIL_OAUTH_CLIENT_SECRET }}
          AJIO_TEST_SENDERS: ${{ secrets.AJIO_TEST_SENDERS }}
          AJIO_GDRIVE_SA_JSON: ${{ secrets.AJIO_GDRIVE_SA_JSON }}
          AJIO_GDRIVE_FOLDER_ID: ${{ secrets.AJIO_GDRIVE_FOLDER_ID }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          ssh_cmd=(ssh -p "$HOSTINGER_PORT")
          scp_cmd=(scp -P "$HOSTINGER_PORT")
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            ssh_cmd+=(-i ~/.ssh/hostinger_key)
            scp_cmd+=(-i ~/.ssh/hostinger_key)
          else
            export SSHPASS="$HOSTINGER_PASSWORD"
            ssh_cmd=(sshpass -e "${ssh_cmd[@]}")
            scp_cmd=(sshpass -e "${scp_cmd[@]}")
          fi

          if [ -n "$HOSTINGER_ENV_FILE" ]; then
            printf '%s\n' "$HOSTINGER_ENV_FILE" > hostinger.env
          else
            cat > hostinger.env <<EOF
          APP_DOMAIN=$APP_DOMAIN
          ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://$APP_DOMAIN}
          DATABASE_URL=$DATABASE_URL
          PGSSL_MODE=${PGSSL_MODE:-require}
          PGSSL_CA_CERT=$PGSSL_CA_CERT
          PG_POOL_MAX=${PG_POOL_MAX:-10}
          FIREBASE_SERVICE_ACCOUNT_JSON=$FIREBASE_SERVICE_ACCOUNT_JSON
          FIREBASE_STORAGE_BUCKET=$FIREBASE_STORAGE_BUCKET
          ORDER_RECONCILE_SECRET=$ORDER_RECONCILE_SECRET
          REPORT_JOB_SECRET=$REPORT_JOB_SECRET
          RESEND_API_KEY=$RESEND_API_KEY
          REPORT_FROM_EMAIL=$REPORT_FROM_EMAIL
          REPORT_TO_EMAILS=$REPORT_TO_EMAILS
          STORAGE_DIR=${STORAGE_DIR:-uploads}
          VITE_API_URL=${VITE_API_URL:-https://$APP_DOMAIN}
          VITE_ORG_ID=${VITE_ORG_ID:-default}
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          VITE_FIREBASE_MEASUREMENT_ID=$VITE_FIREBASE_MEASUREMENT_ID
          VITE_RECAPTCHA_KEY=$VITE_RECAPTCHA_KEY
          AJIO_WFR_SECRET=$AJIO_WFR_SECRET
          AJIO_GMAIL_ADDRESS=$AJIO_GMAIL_ADDRESS
          AJIO_GMAIL_APP_PASSWORD=$AJIO_GMAIL_APP_PASSWORD
          AJIO_GMAIL_OAUTH_CLIENT_ID=$AJIO_GMAIL_OAUTH_CLIENT_ID
          AJIO_GMAIL_OAUTH_CLIENT_SECRET=$AJIO_GMAIL_OAUTH_CLIENT_SECRET
          AJIO_TEST_SENDERS=$AJIO_TEST_SENDERS
          AJIO_GDRIVE_FOLDER_ID=$AJIO_GDRIVE_FOLDER_ID
          AUTO_PROVISION_USERS=false
          EOF
          fi
          # HOSTINGER_ENV_FILE is normally a complete custom env file. Keep
          # separately managed OMSGuru secrets authoritative in both modes;
          # otherwise they silently disappear from the VPS in custom-file mode.
          if [ -n "$OMSGURU_TOKEN" ]; then printf '\nOMSGURU_TOKEN=%s\n' "$OMSGURU_TOKEN" >> hostinger.env; fi
          if [ -n "$OMSGURU_CID" ]; then printf 'OMSGURU_CID=%s\n' "$OMSGURU_CID" >> hostinger.env; fi
          if [ -n "$OMSGURU_WAREHOUSE_ID" ]; then printf 'OMSGURU_WAREHOUSE_ID=%s\n' "$OMSGURU_WAREHOUSE_ID" >> hostinger.env; fi
          # Ajio WFR secrets authoritative in both modes (same rationale).
          if [ -n "$AJIO_WFR_SECRET" ]; then printf 'AJIO_WFR_SECRET=%s\n' "$AJIO_WFR_SECRET" >> hostinger.env; fi
          if [ -n "$AJIO_GMAIL_ADDRESS" ]; then printf 'AJIO_GMAIL_ADDRESS=%s\n' "$AJIO_GMAIL_ADDRESS" >> hostinger.env; fi
          if [ -n "$AJIO_GMAIL_APP_PASSWORD" ]; then printf 'AJIO_GMAIL_APP_PASSWORD=%s\n' "$AJIO_GMAIL_APP_PASSWORD" >> hostinger.env; fi
          if [ -n "$AJIO_GMAIL_OAUTH_CLIENT_ID" ]; then printf 'AJIO_GMAIL_OAUTH_CLIENT_ID=%s\n' "$AJIO_GMAIL_OAUTH_CLIENT_ID" >> hostinger.env; fi
          if [ -n "$AJIO_GMAIL_OAUTH_CLIENT_SECRET" ]; then printf 'AJIO_GMAIL_OAUTH_CLIENT_SECRET=%s\n' "$AJIO_GMAIL_OAUTH_CLIENT_SECRET" >> hostinger.env; fi
          if [ -n "$AJIO_TEST_SENDERS" ]; then printf 'AJIO_TEST_SENDERS=%s\n' "$AJIO_TEST_SENDERS" >> hostinger.env; fi
          if [ -n "$AJIO_GDRIVE_FOLDER_ID" ]; then printf 'AJIO_GDRIVE_FOLDER_ID=%s\n' "$AJIO_GDRIVE_FOLDER_ID" >> hostinger.env; fi
          # Service-account keys are pretty-printed JSON (multiline), which
          # docker env files reject — collapse newlines (JSON ignores them).
          if [ -n "$AJIO_GDRIVE_SA_JSON" ]; then printf 'AJIO_GDRIVE_SA_JSON=%s\n' "$(printf '%s' "$AJIO_GDRIVE_SA_JSON" | tr -d '\r\n')" >> hostinger.env; fi
          # Self-heal a stale DB host pointer, then report the structure
          # (scheme/host/port/user/db presence only — never secret values).
          # If the URL points back at this VPS itself by public hostname
          # (hairpin through an ephemeral published port that vanishes on
          # container recreate), rewrite to the stable Docker-network
          # address. Credentials pass through byte-identical; anything else
          # is left untouched.
          python3 - <<'PYEOF'
          import os
          import re
          from urllib.parse import urlsplit
          with open('hostinger.env') as f:
              lines = f.read().split('\n')
          out = []
          migrated = ''
          for line in lines:
              if line.startswith('DATABASE_URL='):
                  value = line[len('DATABASE_URL='):]
                  try:
                      u = urlsplit(value)
                      print('DATABASE_URL structure: scheme=%s host=%s port=%s user=%s password=%s dbname=%s' % (
                          u.scheme or '-', u.hostname or '-', u.port or '(default)',
                          'set' if u.username else 'missing',
                          'set' if u.password else 'missing',
                          (u.path or '').lstrip('/') or '-'))
                  except Exception as e:
                      print('DATABASE_URL structure: unparsable (%s)' % e)
                  shape = re.sub(r'[A-Za-z0-9]', 'X', value)
                  print('DATABASE_URL shape: %s' % shape)
                  vps_host = (os.environ.get('HOSTINGER_HOST', '') or '').strip().lower()
                  try:
                      u = urlsplit(value)
                      host = (u.hostname or '').lower()
                      port = u.port or 5432
                  except Exception:
                      host, port = '', 0
                  if vps_host and host == vps_host and port not in (5432, 5433):
                      # Authority must end at /, ?, # or end-of-value so an
                      # @ inside userinfo can never match instead.
                      value = re.sub(r'@(\[[^\]]+\]|[^:/@?#\s]+)(:\d+)?(?=[/?#\s]|$)', '@postgres:5432', value, count=1)
                      line = 'DATABASE_URL=' + value
                      migrated = 'VPS hairpin'
              out.append(line)
          with open('hostinger.env', 'w') as f:
              f.write('\n'.join(out))
          print('DATABASE_URL host migrated to postgres:5432 (%s)' % migrated if migrated else 'DATABASE_URL host left untouched')
          PYEOF
          # Guard: docker env files allow ONLY KEY=value lines (plus comments
          # and blanks). Service-account JSON secrets are often pasted
          # pretty-printed (multiline), which breaks compose parsing — so
          # KNOWN JSON keys are repaired first (continuation lines joined;
          # valid JSON is whitespace-insensitive), then validated by parsing.
          # Anything else malformed still fails HERE with a masked shape
          # instead of a cryptic compose error after upload (letters/digits
          # masked to X, so no secret content can ever leak into logs).
          python3 - <<'PYEOF'
          import json
          import re
          import sys
          with open('hostinger.env') as f:
              content = f.read()
          lines = content.split('\n')
          if lines and lines[-1] == '':
              lines.pop()
          JSON_KEYS = ('FIREBASE_SERVICE_ACCOUNT_JSON', 'AJIO_GDRIVE_SA_JSON')
          current_key = None
          current_parts = []
          logical = []

          def flush():
              # Repaired lines go back into `logical` IN ORDER (called when
              # the next KEY= line arrives, before that line is appended).
              if current_key is None:
                  return
              value = ''.join(current_parts)
              try:
                  json.loads(value)
              except Exception as e:
                  print('UNREPAIRABLE %s: not valid JSON (%s)' % (current_key, e))
                  sys.exit(1)
              if len(current_parts) > 1:
                  print('repaired multiline %s into one line' % current_key)
              logical.append('%s=%s' % (current_key, value))

          for line in lines:
              m = re.match(r'^([A-Za-z_][A-Za-z0-9_]*)=(.*)$', line, re.DOTALL)
              if m and m.group(1) in JSON_KEYS:
                  flush()
                  current_key = m.group(1)
                  current_parts = [m.group(2)]
              elif current_key is not None and not re.match(r'^[A-Za-z_][A-Za-z0-9_]*=', line):
                  # Continuation of a pretty-printed JSON value (newlines are
                  # insignificant in JSON, so joining is exact).
                  current_parts.append(line)
              else:
                  flush()
                  current_key = None
                  current_parts = []
                  logical.append(line)
          flush()
          bad = []
          for index, line in enumerate(logical, 1):
              if re.match(r'^[A-Za-z_][A-Za-z0-9_]*=', line):
                  continue
              if re.match(r'^\s*(#|$)', line):
                  continue
              shape = re.sub(r'[A-Za-z0-9]', 'X', line[:80])
              bad.append('line %d: %s' % (index, shape))
          if bad:
              print('INVALID hostinger.env lines (fix the secret or writer):')
              for entry in bad:
                  print('  ' + entry)
              sys.exit(1)
          with open('hostinger.env', 'w') as f:
              f.write('\n'.join(logical) + '\n')
          print('hostinger.env OK (%d assignments)' % len(logical))
          PYEOF
          "${ssh_cmd[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" "mkdir -p /opt/pvms"
          "${scp_cmd[@]}" pvms-source.tar.gz "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/pvms/pvms-source.tar.gz"
          "${scp_cmd[@]}" hostinger.env "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/pvms/hostinger.env"

      - name: Deploy containers
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          ssh_cmd=(ssh -p "$HOSTINGER_PORT")
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            ssh_cmd+=(-i ~/.ssh/hostinger_key)
          else
            export SSHPASS="$HOSTINGER_PASSWORD"
            ssh_cmd=(sshpass -e "${ssh_cmd[@]}")
          fi

          "${ssh_cmd[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" 'bash -s' <<'EOF'
          set -euo pipefail
          
          # Create 2GB swapfile if it doesn't exist to prevent OOM during build
          if [ ! -f /swapfile ]; then
            echo "Creating 2GB swapfile to prevent OOM..."
            fallocate -l 2G /swapfile || dd if=/dev/zero of=/swapfile bs=1M count=2048
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile || true
            echo '/swapfile none swap sw 0 0' | tee -a /etc/fstab || true
          fi

          cd /opt/pvms
          rm -rf app
          mkdir app
          tar -xzf pvms-source.tar.gz -C app
          cd app
          mv /opt/pvms/hostinger.env .env
          chmod 600 .env
          if docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.hostinger.yml --env-file .env up -d --build --remove-orphans
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose -f docker-compose.hostinger.yml --env-file .env up -d --build --remove-orphans
          else
            echo "Docker Compose is not installed on the VPS"
            exit 1
          fi
          docker image prune -f
          EOF
