# Builds the PVMS Packing Station Windows installer and publishes it THREE ways:
#   1. Firebase Storage (fast Google CDN) — the PRIMARY download path. The
#      packing page button (/api/downloads/latest, login-gated) redirects to
#      the public desktop-releases/ object, and installed apps auto-update
#      from the same base. Works while the repo stays private.
#   2. GitHub Release assets — authenticated backup + release-notes trail.
#   3. VPS downloads dir (/opt/pvms/app/downloads) — latest.yml drives the
#      CDN redirect; the local .exe is the fallback if the CDN is unreachable.
#
# Trigger: manual dispatch, or push a tag like desktop-v1.0.1 (bump
# client/package.json version first — the installer name carries it).
name: Release desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - desktop-v*

jobs:
  package:
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Resolve desktop version
        run: |
          $ver = node -p "require('./package.json').version"
          "DESKTOP_VERSION=$ver" >> $env:GITHUB_ENV
          "DESKTOP_TAG=desktop-v$ver" >> $env:GITHUB_ENV
          "DESKTOP_PUBLISH_URL=https://storage.googleapis.com/${{ secrets.FIREBASE_STORAGE_BUCKET }}/desktop-releases/" >> $env:GITHUB_ENV

      - name: Package Windows installer
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_ORG_ID: ${{ secrets.VITE_ORG_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MEASUREMENT_ID: ${{ secrets.VITE_FIREBASE_MEASUREMENT_ID }}
          VITE_RECAPTCHA_KEY: ${{ secrets.VITE_RECAPTCHA_KEY }}
          DESKTOP_PUBLISH_URL: ${{ env.DESKTOP_PUBLISH_URL }}
        run: |
          npm ci
          npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvms-desktop-installer
          path: |
            client/release/*.exe
            client/release/latest.yml
            client/release/*.blockmap
          if-no-files-found: error

      - uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 450.0.0"

      - name: Upload installer to Firebase Storage (public CDN)
        run: |
          $keyFile = Join-Path $env:TEMP "gcp-fw-key.json"
          '${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}' | Out-File -FilePath $keyFile -Encoding utf8
          try {
            gcloud auth activate-service-account --key-file $keyFile
            $bucket = "${{ secrets.FIREBASE_STORAGE_BUCKET }}"
            $ver = $env:DESKTOP_VERSION
            $exe = "release/PVMS-Packing-Setup-$ver-x64.exe"
            gsutil -h "Content-Type:application/octet-stream" cp $exe release/latest.yml "gs://$bucket/desktop-releases/"
            $maps = Get-ChildItem -Path "release/*.blockmap" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
            if ($maps) { gsutil cp $maps "gs://$bucket/desktop-releases/" }
            # Public read on the installer prefix only (packing videos stay private).
            gsutil acl ch -u AllUsers:R "gs://$bucket/desktop-releases/PVMS-Packing-Setup-$ver-x64.exe" "gs://$bucket/desktop-releases/latest.yml"
            foreach ($m in @($maps)) {
              gsutil acl ch -u AllUsers:R ("gs://$bucket/desktop-releases/" + [IO.Path]::GetFileName($m))
            }
          } finally {
            Remove-Item $keyFile -Force -ErrorAction SilentlyContinue
          }

      - name: Publish to GitHub Release (backup + audit trail)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:DESKTOP_TAG
          $ver = $env:DESKTOP_VERSION
          gh release create $tag --title "PVMS Packing Station v$ver" --notes "PVMS Packing Station $ver for packing PCs. Install, sign in, and pack — videos save locally and upload in the background." 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Output "Release $tag exists — updating assets." }
          $assets = @("release/PVMS-Packing-Setup-$ver-x64.exe", "release/latest.yml")
          $maps = Get-ChildItem -Path "release/*.blockmap" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          if ($maps) { $assets += $maps }
          gh release upload $tag --clobber @assets

  publish:
    needs: package
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: pvms-desktop-installer
          path: installer

      - name: Prepare remote access
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            printf '%s\n' "$HOSTINGER_SSH_KEY" > ~/.ssh/hostinger_key
            chmod 600 ~/.ssh/hostinger_key
          else
            sudo apt-get update
            sudo apt-get install -y sshpass
          fi
          for i in {1..5}; do
            ssh-keyscan -p "$HOSTINGER_PORT" "$HOSTINGER_HOST" >> ~/.ssh/known_hosts && break || sleep 5
          done

      - name: Copy installer to VPS downloads dir
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USER: ${{ secrets.HOSTINGER_USER }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT || 22 }}
        run: |
          ssh_cmd=(ssh -p "$HOSTINGER_PORT")
          scp_cmd=(scp -P "$HOSTINGER_PORT")
          if [ -n "$HOSTINGER_SSH_KEY" ]; then
            ssh_cmd+=(-i ~/.ssh/hostinger_key)
            scp_cmd+=(-i ~/.ssh/hostinger_key)
          else
            export SSHPASS="$HOSTINGER_PASSWORD"
            ssh_cmd=(sshpass -e "${ssh_cmd[@]}")
            scp_cmd=(sshpass -e "${scp_cmd[@]}")
          fi
          "${ssh_cmd[@]}" "${HOSTINGER_USER}@${HOSTINGER_HOST}" "mkdir -p /opt/pvms/app/downloads"
          "${scp_cmd[@]}" installer/* "${HOSTINGER_USER}@${HOSTINGER_HOST}:/opt/pvms/app/downloads/"
