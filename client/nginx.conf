server {
  listen 80;
  server_name _;

  # Don't advertise the nginx version in error pages / Server header.
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Baseline browser hardening for the SPA shell. The API lives on the same
  # origin behind Traefik (which also sets HSTS at the edge); these headers
  # are the defense-in-depth layer served with every HTML/asset response.
  # `always` keeps them on error responses (e.g. the SPA fallback) too.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; media-src 'self' https: blob:; worker-src 'self' blob:; frame-src 'self' https://www.google.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri $uri/ /index.html;
  }

  location /health {
    add_header Content-Type text/plain;
    return 200 "OK";
  }
}
